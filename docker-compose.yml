services:
  db:
    image: postgres:17.5-alpine3.21
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"

  pgAdmin:
    image: dpage/pgadmin4:9.5.0
    restart: always
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-turbokwaka}/allo-scraper:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      - db

volumes:
  postgres_db:
  pgadmin-data: